# Ensure bond data persists to flash
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Maximum TX power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable 2M PHY - improves compatibility with macOS
CONFIG_BT_CTLR_PHY_2M=n

# BLE connection parameters
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Increase BLE buffers
CONFIG_BT_BUF_ACL_TX_COUNT=16
CONFIG_BT_BUF_EVT_RX_COUNT=20
CONFIG_BT_L2CAP_TX_BUF_COUNT=16

# Battery reporting interval in seconds (300 = 5 minutes)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# ==========================================
# Sleep/Power Management Configuration
# ==========================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

