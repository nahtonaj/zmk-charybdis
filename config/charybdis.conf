# Maximum TX power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable all experimental BLE features (security + connection/2M PHY disable)
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Disable GATT subscription enforcement (fixes stale state after reconnect)
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Disable battery service over BLE (prevents macOS reconnection interference)
CONFIG_BT_BAS=n

# BLE connection parameters (lower intervals = faster reconnection)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Increase BLE buffers
CONFIG_BT_BUF_ACL_TX_COUNT=16
CONFIG_BT_BUF_EVT_RX_COUNT=20
CONFIG_BT_L2CAP_TX_BUF_COUNT=16

# ==========================================
# Sleep/Power Management Configuration
# ==========================================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

