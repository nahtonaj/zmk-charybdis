# ==========================================
# Bluetooth Connection Stability Settings
# ==========================================

# Maximum TX power for better range and reconnection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Experimental connection management - disables 2M PHY for better
# compatibility with Windows/Intel/Realtek chipsets (replaces raw PHY disable)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Experimental security - allows re-pairing without manual bond clear
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Disable GATT subscription enforcement - fixes Windows battery notification bugs
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# BLE connection parameters for better reconnection after sleep
# Lower intervals = faster reconnection, slightly more power
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Increase BLE buffers to prevent dropped connections during heavy traffic
# Note: BT_BUF_EVT_RX_COUNT must be > BT_BUF_ACL_TX_COUNT (Zephyr requirement)
CONFIG_BT_BUF_ACL_TX_COUNT=16
CONFIG_BT_BUF_EVT_RX_COUNT=20
CONFIG_BT_L2CAP_TX_BUF_COUNT=16

# Battery reporting interval in seconds (300 = 5 minutes)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# ZMK Studio disabled - conflicts with deep sleep on Zephyr 4.1
# See: https://github.com/zmkfirmware/zmk/issues/3195
# CONFIG_ZMK_STUDIO=y

# ==========================================
# Sleep/Power Management Configuration
# ==========================================
CONFIG_ZMK_SLEEP=y
# Idle timeout: 5 minutes (keyboard enters low-power idle)
CONFIG_ZMK_IDLE_TIMEOUT=300000
# Deep sleep timeout: 15 minutes after idle (20 minutes total inactivity)
# Shorter timeout helps prevent "stuck" states; wake via keypress
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ==========================================
# RGB Underglow Configuration
# ==========================================
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y




