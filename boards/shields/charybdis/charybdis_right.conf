CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

# Enable USB for ZMK Studio
CONFIG_ZMK_USB=y

# Split keyboard battery reporting
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_QUEUE_SIZE=5

# ==========================================
# PMW3610 Trackball Configuration
# ==========================================
CONFIG_PMW3610_ALT=y

# Minimum report interval in ms - higher = less BLE traffic, better sleep behavior
# Default is 8ms (125Hz), 12ms = ~83Hz which is still smooth but less demanding
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# Extra delay on power-up to ensure sensor initializes properly after wake
# Helps prevent "Incorrect product id 0xFF" errors after sleep
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=500

# Smooth scrolling via HID resolution multipliers
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

